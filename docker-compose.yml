services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btc_quantum_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ENVIRONMENT=production
      - DELTA_REST_URL=https://api.india.delta.exchange
      - DELTA_WS_URL=wss://public-socket.india.delta.exchange
      - SYMBOL=BTCUSD
      - PORT=8000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/btc_quantum.db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,testserver}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: btc_quantum_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
